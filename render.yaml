services:
  - type: web
    name: mcp-server-motherduck
    env: python
    buildCommand: pip install uv && FOUND=0 && for dir in . .. ../.. /opt/render/project/src /opt/render/project; do if [ -f "$dir/pyproject.toml" ]; then cd "$dir" && uv pip install -e . && FOUND=1 && break; fi; done && if [ "$FOUND" -eq 0 ]; then echo "ERROR: pyproject.toml not found" && pwd && ls -la && exit 1; fi
    startCommand: uv run mcp-server-motherduck --transport sse --host 0.0.0.0 --port $PORT --db-path md:mcp_app_ChatGPT --motherduck-token $MOTHERDUCK_TOKEN
    envVars:
      - key: MOTHERDUCK_TOKEN
        sync: false
      - key: PORT
        fromService:
          type: web
          name: mcp-server-motherduck
          property: port
